<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV.Build — Your Templates</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Playfair+Display:wght@400;500;600;700;800&family=DM+Serif+Display&family=Space+Grotesk:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #88ffc6;
      --border: #ddd;
      --grey: rgba(0,0,0,0.45);
      --cv-accent: #88ffc6;
      --cv-bg: #fff;
      --cv-text: #111;
      --cv-muted: #666;
      --cv-sidebar-bg: #000;
      --cv-sidebar-text: #fff;
      --cv-heading-font: "Montserrat", sans-serif;
      --cv-body-font: "Montserrat", sans-serif;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Libre Baskerville",serif; background:#fff; color:#000; min-height:100vh; overflow-x:hidden; }

    .page-header { padding:25px 60px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:#fff; z-index:200; }
    .logo { font-family:"Cormorant Garamond",serif; font-size:22px; font-weight:700; text-transform:uppercase; letter-spacing:5px; color:#000; text-decoration:none; }
    .header-badges { display:flex; gap:8px; align-items:center; }
    .badge { font-family:"Libre Baskerville",serif; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:2px; background:#000; color:#fff; padding:7px 16px; }
    .badge.outline { background:#fff; color:#000; border:1px solid #000; }

    .hero { padding:50px 60px 30px; border-bottom:1px solid var(--border); }
    .hero-label { font-size:10px; text-transform:uppercase; letter-spacing:5px; color:var(--grey); margin-bottom:10px; }
    .hero-heading { font-family:"Cormorant Garamond",serif; font-size:64px; font-weight:700; text-transform:uppercase; line-height:1; letter-spacing:2px; }
    .hero-heading span { color:#fff; -webkit-text-stroke:2px #000; }
    .hero-sub { font-size:11px; color:var(--grey); text-transform:uppercase; letter-spacing:2px; margin-top:12px; }

    .carousel-wrap { position:relative; padding:50px 0 30px; }
    .carousel-track-outer { overflow:hidden; width:100%; }
    .carousel-track { display:flex; transition:transform 0.5s cubic-bezier(0.77,0,0.175,1); }
    .carousel-slide { min-width:100%; padding:0 60px; display:flex; flex-direction:column; align-items:center; }
    .slide-label { width:100%; max-width:860px; display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .slide-label .template-name { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:4px; }
    .slide-label .template-num { font-size:10px; color:var(--grey); letter-spacing:2px; }
    .cv-preview-wrapper { width:100%; max-width:860px; position:relative; box-shadow:0 20px 80px rgba(0,0,0,0.12); }

    .select-bar { width:100%; max-width:860px; margin-top:20px; display:flex; align-items:center; justify-content:space-between; }
    .select-label { font-size:10px; text-transform:uppercase; letter-spacing:2px; color:var(--grey); }
    .select-checkbox { display:flex; align-items:center; gap:12px; cursor:pointer; }
    .custom-check { width:24px; height:24px; border:2px solid #000; display:flex; align-items:center; justify-content:center; }
    .custom-check::after { content:'✓'; font-size:13px; font-weight:700; color:#fff; opacity:0; }
    .select-checkbox.checked .custom-check { background:#000; }
    .select-checkbox.checked .custom-check::after { opacity:1; }
    .check-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:2px; }

    .carousel-controls { display:flex; align-items:center; justify-content:center; gap:30px; padding:30px 60px; border-top:1px solid var(--border); }
    .carousel-btn { background:none; border:1px solid #000; width:50px; height:50px; font-size:20px; cursor:pointer; transition:all 0.3s; }
    .carousel-btn:hover { background:#000; color:#fff; }
    .carousel-btn:disabled { opacity:0.2; cursor:not-allowed; }
    .carousel-btn:disabled:hover { background:none; color:#000; }
    .carousel-dots { display:flex; gap:10px; }
    .dot { width:8px; height:8px; background:var(--border); cursor:pointer; transition:all 0.3s; }
    .dot.active { background:#000; width:24px; }

    .bottom-bar { position:fixed; bottom:0; left:0; width:100%; background:#000; padding:20px 60px; display:flex; align-items:center; justify-content:space-between; z-index:300; transform:translateY(100%); transition:transform 0.4s ease; }
    .bottom-bar.visible { transform:translateY(0); }
    .bottom-bar-label { font-size:9px; text-transform:uppercase; letter-spacing:3px; color:rgba(255,255,255,0.5); }
    .bottom-bar-title { font-family:"Cormorant Garamond",serif; font-size:28px; font-weight:700; color:#fff; text-transform:uppercase; letter-spacing:3px; }
    .bottom-bar-sub { font-size:9px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:2px; }
    .dl-btn { background:#fff; color:#000; border:none; padding:18px 50px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:3px; cursor:pointer; }

    .loading-screen { position:fixed; inset:0; background:#fff; z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; }
    .loading-screen.hidden { display:none; }
    .loading-title { font-family:"Cormorant Garamond",serif; font-size:18px; font-weight:700; text-transform:uppercase; letter-spacing:6px; }
    .loading-bar-wrap { width:300px; height:1px; background:var(--border); }
    .loading-bar-fill { height:100%; background:#000; width:0%; transition:width 0.3s ease; }
    .loading-status { font-size:10px; color:var(--grey); text-transform:uppercase; letter-spacing:2px; }

    /* CV base */
    .cv-page {
      background: var(--cv-bg);
      color: var(--cv-text);
      font-family: var(--cv-body-font);
      min-height: 900px;
    }
    .cv-name { font-family: var(--cv-heading-font); font-weight: 700; line-height: 1.1; }
    .cv-role { text-transform: uppercase; letter-spacing: 3px; color: var(--cv-muted); font-size: 10px; font-weight: 600; }
    .cv-contact { display:flex; flex-wrap:wrap; gap:18px; font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--cv-muted); }
    .cv-section-title { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:4px; margin-bottom:12px; }
    .cv-summary, .cv-exp-desc, .cv-custom-content { font-size:11px; line-height:1.8; color:var(--cv-muted); }
    .cv-exp-item { margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid rgba(0,0,0,0.08); }
    .cv-exp-item:last-child { border-bottom:none; }
    .cv-exp-title { font-size:12px; font-weight:700; text-transform:uppercase; }
    .cv-exp-meta { font-size:9px; color:var(--cv-muted); text-transform:uppercase; margin:4px 0 8px; }
    .cv-skill { display:inline-block; font-size:9px; text-transform:uppercase; margin:0 6px 6px 0; padding:4px 10px; border:1px solid currentColor; }
    .cv-lang-item, .cv-edu-item { display:flex; justify-content:space-between; gap:10px; font-size:10px; padding:5px 0; border-bottom:1px solid rgba(0,0,0,0.08); text-transform:uppercase; }
    .cv-section-block { margin-bottom:28px; }
    .cv-two-col { display:grid; grid-template-columns:1fr 1fr; gap:30px; }

    /* Layouts */
    .layout-single { padding:50px; }
    .layout-single .cv-name { font-size:34px; letter-spacing:4px; text-transform:uppercase; margin-bottom:6px; }
    .layout-single .cv-role { margin-bottom:20px; }
    .layout-single .cv-contact { padding-bottom:20px; border-bottom:1px solid rgba(0,0,0,0.15); margin-bottom:24px; }

    .layout-centered { padding:55px; text-align:center; }
    .layout-centered .cv-name { font-size:40px; letter-spacing:6px; text-transform:uppercase; }
    .layout-centered .cv-contact { justify-content:center; margin:16px 0 28px; }
    .layout-centered .cv-divider { width:60px; height:1px; background:currentColor; margin:0 auto 24px; opacity:0.3; }

    .layout-banner .cv-banner { padding:42px 50px; background:var(--cv-sidebar-bg); color:var(--cv-sidebar-text); text-align:center; }
    .layout-banner .cv-banner .cv-role { color:var(--cv-accent); }
    .layout-banner .cv-banner .cv-contact { justify-content:center; color:rgba(255,255,255,0.65); margin-top:14px; }
    .layout-banner .cv-body { padding:40px 50px; }

    .layout-sidebar { display:grid; grid-template-columns:250px 1fr; min-height:900px; }
    .layout-sidebar .cv-sidebar { background:var(--cv-sidebar-bg); color:var(--cv-sidebar-text); padding:38px 24px; }
    .layout-sidebar .cv-sidebar .cv-name { color:#fff; font-size:22px; text-transform:uppercase; margin-bottom:6px; }
    .layout-sidebar .cv-sidebar .cv-role { color:var(--cv-accent); margin-bottom:24px; }
    .layout-sidebar .cv-sidebar .cv-contact-item { font-size:9px; color:rgba(255,255,255,0.75); margin-bottom:6px; word-break:break-all; }
    .layout-sidebar .cv-sidebar .cv-section-title { color:rgba(255,255,255,0.45); margin-top:22px; }
    .layout-sidebar .cv-sidebar .cv-skill { border-color:rgba(255,255,255,0.25); color:#fff; }
    .layout-sidebar .cv-main { padding:40px 36px; }

    .layout-split-top { padding:0; }
    .layout-split-top .cv-top { padding:42px 48px 0; display:flex; justify-content:space-between; align-items:flex-end; gap:20px; }
    .layout-split-top .cv-top .cv-name { font-size:42px; text-transform:uppercase; line-height:0.95; }
    .layout-split-top .cv-top .cv-role { text-align:right; }
    .layout-split-top .cv-bar { height:4px; background:#000; margin:18px 48px 0; }
    .layout-split-top .cv-contact-bar { background:#000; color:#fff; padding:12px 48px; display:flex; flex-wrap:wrap; gap:24px; font-size:9px; text-transform:uppercase; }
    .layout-split-top .cv-body { padding:34px 48px; display:grid; grid-template-columns:1fr 220px; gap:36px; }

    .layout-newspaper { padding:48px; font-family:"Playfair Display", serif; }
    .layout-newspaper .cv-masthead { text-align:center; border-top:4px solid #000; border-bottom:4px solid #000; padding:18px 0; }
    .layout-newspaper .cv-masthead .cv-name { font-size:48px; text-transform:uppercase; }
    .layout-newspaper .cv-dateline { display:flex; justify-content:space-between; font-family:"Montserrat",sans-serif; font-size:9px; text-transform:uppercase; padding:8px 0; border-bottom:1px solid #000; margin-bottom:18px; color:#777; }
    .layout-newspaper .cv-columns { display:grid; grid-template-columns:1fr 1fr 1fr; border-top:1px solid #000; }
    .layout-newspaper .cv-col { padding:18px; border-right:1px solid #000; }
    .layout-newspaper .cv-col:last-child { border-right:none; }

    .layout-accent-bar { display:grid; grid-template-columns:12px 1fr; min-height:900px; }
    .layout-accent-bar .cv-accent-strip { background:var(--cv-accent); }
    .layout-accent-bar .cv-top { padding:38px 40px 28px; border-bottom:2px solid #000; display:flex; justify-content:space-between; align-items:flex-end; }
    .layout-accent-bar .cv-top .cv-name { font-size:36px; text-transform:uppercase; }
    .layout-accent-bar .cv-body { padding:34px 40px; display:grid; grid-template-columns:1fr 220px; gap:36px; }

    /* Theme overrides */
    .theme-minimal { --cv-bg:#fff; --cv-text:#111; --cv-muted:#666; --cv-accent:#111; --cv-heading-font:"Montserrat",sans-serif; }
    .theme-elegant { --cv-heading-font:"Cormorant Garamond",serif; --cv-body-font:"Montserrat",sans-serif; }
    .theme-swiss { --cv-heading-font:"Montserrat",sans-serif; }
    .theme-mono { --cv-bg:#fafafa; --cv-text:#111; --cv-muted:#555; --cv-accent:#111; }
    .theme-air { --cv-bg:#fff; --cv-text:#222; --cv-muted:#999; --cv-accent:#bbb; }

    .theme-modern { --cv-sidebar-bg:#000; --cv-accent:#88ffc6; }
    .theme-tech { --cv-bg:#0d0d0d; --cv-text:#fff; --cv-muted:#888; --cv-sidebar-bg:#111; --cv-accent:#88ffc6; --cv-heading-font:"Space Grotesk",sans-serif; --cv-body-font:"Space Grotesk",sans-serif; }
    .theme-metro { --cv-sidebar-bg:#1f1f1f; --cv-accent:#fff; }
    .theme-horizon { --cv-bg:#f4f4f4; --cv-sidebar-bg:#111; --cv-accent:#88ffc6; }
    .theme-stripe { --cv-sidebar-bg:#000; --cv-accent:#fff; }

    .theme-classic { --cv-heading-font:"Montserrat",sans-serif; }
    .theme-corporate { --cv-heading-font:"Playfair Display",serif; --cv-sidebar-bg:#000; --cv-accent:#88ffc6; }
    .theme-executive { --cv-bg:#f9f7f4; --cv-heading-font:"DM Serif Display",serif; --cv-accent:#111; }
    .theme-academic { --cv-sidebar-bg:#1a1a2e; --cv-accent:#a8d8ea; }
    .theme-heritage { --cv-bg:#fff; --cv-accent:#8b4513; }
    .theme-formal { --cv-heading-font:"Playfair Display",serif; --cv-accent:#111; }
    .theme-law { --cv-bg:#fff; --cv-text:#111; --cv-muted:#444; --cv-accent:#1a2744; --cv-sidebar-bg:#1a2744; }

    .theme-creative { --cv-heading-font:"Montserrat",sans-serif; --cv-accent:#000; }
    .theme-bold { --cv-accent:#88ffc6; }
    .theme-neon { --cv-bg:#111; --cv-text:#fff; --cv-muted:#777; --cv-accent:#88ffc6; --cv-heading-font:"Space Grotesk",sans-serif; --cv-body-font:"Space Grotesk",sans-serif; }
    .theme-magazine { --cv-accent:#e10600; --cv-heading-font:"Playfair Display",serif; }
    .theme-portfolio { --cv-accent:#000; }
    .theme-artdeco { --cv-bg:#f6f1e8; --cv-accent:#b8860b; --cv-heading-font:"Cormorant Garamond",serif; }

    .theme-tech .cv-exp-item,
    .theme-neon .cv-exp-item,
    .theme-tech .cv-lang-item,
    .theme-neon .cv-lang-item { border-bottom-color:rgba(255,255,255,0.08); }

    @media (max-width:768px) {
      .page-header, .hero, .carousel-slide, .carousel-controls, .bottom-bar { padding-left:20px; padding-right:20px; }
      .hero-heading { font-size:32px; }
      .layout-sidebar, .layout-split-top .cv-body, .layout-accent-bar .cv-body, .layout-newspaper .cv-columns { grid-template-columns:1fr; }
      .layout-single, .layout-centered, .layout-newspaper, .layout-banner .cv-body { padding:30px; }
    }

    /* MINIMAL — Pure */
.layout-pure { padding: 70px 60px; }
.layout-pure .cv-name { font-size: 24px; font-weight: 300; letter-spacing: 12px; text-transform: uppercase; }
.layout-pure .cv-role { margin: 12px 0 40px; letter-spacing: 5px; font-size: 9px; }
.layout-pure .cv-section-title { letter-spacing: 6px; font-size: 8px; margin-bottom: 16px; }
.layout-pure .cv-exp-item { border: none; padding: 0; margin-bottom: 22px; }

/* MINIMAL — Linear */
.layout-linear { padding: 50px; }
.layout-linear .cv-header { border-bottom: 3px solid #000; padding-bottom: 20px; margin-bottom: 28px; }
.layout-linear .cv-name { font-size: 30px; font-weight: 800; text-transform: uppercase; }
.layout-linear .cv-rule { height: 1px; background: #000; margin: 24px 0; opacity: 0.15; }

/* MINIMAL — Slate */
.layout-slate { padding: 55px; background: #f7f7f7; }
.layout-slate .cv-card { background: #fff; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); }
.layout-slate .cv-name { font-size: 32px; font-weight: 600; color: #222; }

/* MODERN — Nexus */
.layout-nexus { display: grid; grid-template-columns: 280px 1fr; min-height: 900px; }
.layout-nexus .cv-sidebar { background: linear-gradient(180deg, #0f172a, #1e293b); color: #fff; padding: 45px 28px; }
.layout-nexus .cv-sidebar .cv-name { font-size: 24px; color: #fff; text-transform: uppercase; }
.layout-nexus .cv-sidebar .cv-role { color: #38bdf8; }
.layout-nexus .cv-main { padding: 45px 40px; background: #fff; }
.layout-nexus .cv-section-title { color: #0f172a; border-left: 4px solid #38bdf8; padding-left: 12px; }

/* MODERN — Pulse */
.layout-pulse .cv-hero-band { background: linear-gradient(135deg, #000, #333); color: #fff; padding: 50px; }
.layout-pulse .cv-hero-band .cv-name { font-size: 42px; text-transform: uppercase; }
.layout-pulse .cv-hero-band .cv-role { color: #88ffc6; margin-top: 8px; }
.layout-pulse .cv-body { padding: 40px 50px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; }

/* MODERN — Core */
.layout-core { padding: 0; }
.layout-core .cv-top { padding: 45px 50px 20px; display: flex; justify-content: space-between; align-items: flex-start; }
.layout-core .cv-name { font-size: 48px; font-weight: 900; text-transform: uppercase; line-height: 0.95; letter-spacing: -1px; }
.layout-core .cv-body { padding: 20px 50px 45px; border-top: 6px solid #000; }

/* CLASSIC — Oxford */
.layout-oxford { padding: 55px 60px; font-family: "Playfair Display", serif; }
.layout-oxford .cv-name { font-size: 44px; text-align: center; letter-spacing: 4px; }
.layout-oxford .cv-role { text-align: center; font-family: "Montserrat", sans-serif; margin: 10px 0 30px; }
.layout-oxford .cv-ornament { text-align: center; color: #999; margin-bottom: 30px; letter-spacing: 8px; }

/* CLASSIC — Boardroom */
.layout-boardroom { min-height: 900px; }
.layout-boardroom .cv-header { background: #1a1a1a; color: #fff; padding: 45px 55px; }
.layout-boardroom .cv-header .cv-name { font-size: 38px; letter-spacing: 5px; text-transform: uppercase; }
.layout-boardroom .cv-header .cv-role { color: #c9a96e; margin-top: 8px; }
.layout-boardroom .cv-body { background: #faf8f5; padding: 45px 55px; }

/* CLASSIC — Chronicle */
.layout-chronicle { padding: 50px; font-family: "Playfair Display", serif; }
.layout-chronicle .cv-name { font-size: 40px; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 8px; }
.layout-chronicle .cv-columns { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-top: 30px; }

/* CREATIVE — Studio */
.layout-studio { padding: 0; min-height: 900px; background: #fff; }
.layout-studio .cv-top { padding: 50px 50px 30px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: end; }
.layout-studio .cv-name { font-size: 56px; font-weight: 900; line-height: 0.9; text-transform: uppercase; }
.layout-studio .cv-accent-block { background: #000; color: #fff; padding: 30px; margin: 0 50px; }
.layout-studio .cv-body { padding: 35px 50px; display: grid; grid-template-columns: 1fr 240px; gap: 35px; }

/* CREATIVE — Vivid */
.layout-vivid { min-height: 900px; display: grid; grid-template-columns: 18px 1fr; }
.layout-vivid .cv-color-bar { background: linear-gradient(180deg, #ff006e, #8338ec, #3a86ff); }
.layout-vivid .cv-inner { padding: 45px; }
.layout-vivid .cv-name { font-size: 44px; font-weight: 900; text-transform: uppercase; }
.layout-vivid .cv-skill { background: #000; color: #fff; border: none; }

/* CREATIVE — Pixel */
.layout-pixel { background: #1a1a2e; color: #eee; padding: 45px; font-family: "Space Grotesk", sans-serif; min-height: 900px; }
.layout-pixel .cv-name { font-size: 28px; font-family: monospace; color: #88ffc6; }
.layout-pixel .cv-name::before { content: '> '; color: #ff6b6b; }
.layout-pixel .cv-section-title { color: #88ffc6; font-family: monospace; letter-spacing: 2px; }
.layout-pixel .cv-exp-item { border-bottom-color: #333; }

/* CREATIVE — Canvas */
.layout-canvas { padding: 60px; background: #fff; }
.layout-canvas .cv-name { font-size: 52px; font-family: "Cormorant Garamond", serif; font-weight: 300; letter-spacing: 6px; text-transform: uppercase; }
.layout-canvas .cv-role { font-size: 11px; letter-spacing: 5px; margin: 12px 0 40px; }
.layout-canvas .cv-body { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
.layout-canvas .cv-section-title { font-size: 10px; letter-spacing: 5px; border-bottom: 1px solid #000; padding-bottom: 8px; }
  </style>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <p class="loading-title">Generating Your CVs</p>
    <div class="loading-bar-wrap"><div class="loading-bar-fill" id="loadingBar"></div></div>
    <p class="loading-status" id="loadingStatus">Preparing your information...</p>
  </div>

  <header class="page-header">
    <a href="index.html" class="logo">CV<span>.</span>Build</a>
    <div class="header-badges">
      <div class="badge outline" id="genreBadge">Modern</div>
      <div class="badge">Free Download</div>
    </div>
  </header>

  <div class="hero">
    <p class="hero-label">Step 03 — Choose Your Template</p>
    <h1 class="hero-heading">Your <span>3 CV</span> Templates</h1>
    <p class="hero-sub" id="heroSub">3 modern templates — pick your favorite</p>
  </div>

  <div class="carousel-wrap">
    <div class="carousel-track-outer">
      <div class="carousel-track" id="carouselTrack"></div>
    </div>
    <div class="carousel-controls">
      <button class="carousel-btn" id="prevBtn" onclick="slide(-1)" disabled>←</button>
      <div class="carousel-dots" id="dotsContainer"></div>
      <button class="carousel-btn" id="nextBtn" onclick="slide(1)">→</button>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <div>
      <div class="bottom-bar-label">Selected</div>
      <div class="bottom-bar-title" id="selectedTemplateName">—</div>
      <div class="bottom-bar-sub">Click download to get your free CV</div>
    </div>
    <button class="dl-btn" onclick="proceedToDownload()">Download Free →</button>
  </div>

  <script>
    const cvData = JSON.parse(localStorage.getItem('cvData') || '{}');
    const genreLabels = { modern:'Modern', classic:'Classic', creative:'Creative', minimal:'Minimal' };
    const userGenre = cvData.cvGenre || localStorage.getItem('cvGenre') || 'modern';

    if (!cvData.fullName) window.location.href = 'question.html';

      document.getElementById(id).innerHTML = html;

    function buildCarousel() {
      const track = document.getElementById('carouselTrack');
      const dots = document.getElementById('dotsContainer');
      track.innerHTML = '';
      dots.innerHTML = '';

      chosenTemplates.forEach((tpl, i) => {
        const slide = document.createElement('div');
        slide.className = 'carousel-slide';
        slide.innerHTML = `
          <div class="slide-label">
            <span class="template-name">Template 0${i + 1} — ${tpl.name}</span>
            <span class="template-num">${i + 1} / 3</span>
          </div>
          <div class="cv-preview-wrapper"><div id="tpl-${i}"></div></div>
          <div class="select-bar">
            <span class="select-label">Select this template</span>
            <div class="select-checkbox" id="check${i}" onclick="toggleSelect(${i})">
              <div class="custom-check"></div>
              <span class="check-label">Choose</span>
            </div>
          </div>`;
        track.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => goTo(i);
        dots.appendChild(dot);

        renderTemplate(`tpl-${i}`, tpl);
      });

      updateCarousel();
    }

    function simulateLoading() {
      const bar = document.getElementById('loadingBar');
      const status = document.getElementById('loadingStatus');
      const steps = [
        { pct: 20, msg: 'Reading your details...' },
        { pct: 50, msg: `Selecting your ${genreLabels[userGenre] || userGenre} templates...` },
        { pct: 80, msg: 'Designing your CVs...' },
        { pct: 100, msg: 'Done! Your CVs are ready.' },
      ];
      let i = 0;
      (function next() {
        if (i >= steps.length) {
          setTimeout(() => document.getElementById('loadingScreen').classList.add('hidden'), 500);
          return;
        }
        bar.style.width = steps[i].pct + '%';
        status.textContent = steps[i].msg;
        i++;
        setTimeout(next, 700);
      })();
    }

    function slide(dir) {
      current = Math.max(0, Math.min(chosenTemplates.length - 1, current + dir));
      updateCarousel();
    }

    function goTo(i) {
      current = i;
      updateCarousel();
    }

    function updateCarousel() {
      document.getElementById('carouselTrack').style.transform = `translateX(-${current * 100}%)`;
      document.getElementById('prevBtn').disabled = current === 0;
      document.getElementById('nextBtn').disabled = current === chosenTemplates.length - 1;
      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
    }

    function toggleSelect(index) {
      if (selectedIndex === index) {
        selectedIndex = null;
        document.getElementById('check' + index).classList.remove('checked');
        document.getElementById('bottomBar').classList.remove('visible');
      } else {
        if (selectedIndex !== null) document.getElementById('check' + selectedIndex).classList.remove('checked');
        selectedIndex = index;
        document.getElementById('check' + index).classList.add('checked');
        document.getElementById('selectedTemplateName').textContent = chosenTemplates[index].name;
        document.getElementById('bottomBar').classList.add('visible');
      }
    }

    function proceedToDownload() {
      if (selectedIndex === null) return;
      const selected = chosenTemplates[selectedIndex];
      localStorage.setItem('selectedTemplateId', String(selected.id));
      localStorage.setItem('selectedTemplateName', selected.name);
      localStorage.setItem('selectedTemplateGenre', selected.genre);
      localStorage.setItem('selectedTemplateLayout', selected.layout);
      localStorage.setItem('selectedTemplateTheme', selected.theme);
      window.location.href = 'download.html';
    }

    simulateLoading();
    setTimeout(buildCarousel, 300);
  </script>
